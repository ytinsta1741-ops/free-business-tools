<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice Due Date Calculator — BusinessOS</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://businessos.biz/tools/invoice-due-date-calculator/" />
<style>
  :root { color-scheme: light dark; --bg:#0f1a1c; --surface:#142428; --surface-2:#1a2d31; --line:#2a4147; --text:#eef4f5; --muted:#a7b8bb; --accent:#45d7d1; --accent-fg:#0f1a1c; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f9fa; --surface:#fff; --surface-2:#eef3f4; --line:#d5dfe1; --text:#10262a; --muted:#4b6266; --accent:#0e8a86; --accent-fg:#fff; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
  .wrap { padding: 16px 18px; }
  h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; color: var(--text); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .ef { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .ef input, .ef select { font: inherit; font-size: 13px; padding: 7px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; color: var(--text); }
  .out { margin-top: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; white-space: pre-wrap; min-height: 40px; }
  .foot { margin-top: 12px; text-align: center; font-size: 11px; color: var(--muted); }
  .foot a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .foot a:hover { text-decoration: underline; }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h2>Invoice Due Date Calculator</h2>
  <form class="grid" id="f">
    <label class="ef"><span>Invoice date</span><input id="f-issueDate" type="date" /></label>
      <label class="ef"><span>Payment terms</span><select id="f-terms"><option value="Due on receipt">Due on receipt</option><option value="Net 7">Net 7</option><option value="Net 15">Net 15</option><option value="Net 30">Net 30</option><option value="Net 45">Net 45</option><option value="Net 60">Net 60</option><option value="Net 90">Net 90</option></select></label>
  </form>
  <pre class="out" id="o" aria-live="polite"></pre>
  <p class="foot">Powered by <a href="https://businessos.biz/tools/invoice-due-date-calculator/?utm_source=embed" target="_blank" rel="noopener">BusinessOS</a> · Free during limited early access</p>
</div>
<script>
(function(){
  var fields = ["issueDate","terms"];
  var dateFields = ["issueDate"];
  var out = document.getElementById('o');
  var form = document.getElementById('f');
  dateFields.forEach(function(id){
    var el = document.getElementById('f-'+id);
    if (el && !el.value) el.value = new Date().toISOString().slice(0,10);
  });
  function readValues(){ var v={}; fields.forEach(function(id){ var el=document.getElementById('f-'+id); if(el) v[id]=el.value; }); return v; }
  function compute(v){
      const d = v.issueDate ? new Date(v.issueDate) : new Date();
      const t = (v.terms||'Net 30');
      let days = 0;
      if(t==='Due on receipt') days = 0;
      else days = parseInt(t.replace(/[^0-9]/g,''),10)||30;
      const due = new Date(d.getTime()+days*86400000);
      const today=new Date(); today.setHours(0,0,0,0);
      const daysLeft=Math.round((due-today)/86400000);
      const remind1=new Date(due.getTime()-7*86400000);
      const remind2=new Date(due.getTime()+3*86400000);
      const fmt=x=>x.toISOString().slice(0,10);
      return 'Due: '+fmt(due)+'\n'+(daysLeft>=0?daysLeft+' days remaining':(Math.abs(daysLeft)+' days overdue'))+'\nFirst reminder: '+fmt(remind1)+' (7 days before)\nSecond reminder: '+fmt(remind2)+' (3 days after)';
    }
  function run(){ try { out.textContent = compute(readValues()); } catch(e){ out.textContent='Error: '+e.message; } }
  form.addEventListener('input', run);
  form.addEventListener('change', run);
  run();
})();
</script>
</body>
</html>
